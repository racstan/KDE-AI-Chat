name: CI

# Runs on the local Gitea (act_runner with rootless podman), not GitHub
# Actions. Runner labels map to local images:
#   ubuntu-latest -> localhost/act-ubuntu
#   arch-plasma   -> localhost/act-arch-plasma (ci/arch-plasma/Containerfile)
on:
  push:
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest anyio

      - name: Run tests
        run: |
          pytest -q

      - name: Check file sizes
        run: |
          python scripts/check_file_sizes.py

      - name: Verify a freshly built package contains the source tree
        run: |
          python - <<'PY'
          import pathlib, tempfile, zipfile
          root = pathlib.Path("org.kde.plasma.kdeaichat")
          with tempfile.NamedTemporaryFile(suffix=".plasmoid") as f:
              with zipfile.ZipFile(f.name, "w", zipfile.ZIP_DEFLATED) as archive:
                  for path in root.rglob("*"):
                      if path.is_file() and "__pycache__" not in path.parts and "translate/venv" not in str(path):
                          archive.write(path, path.as_posix())
              with zipfile.ZipFile(f.name) as archive:
                  names = set(archive.namelist())
                  required = [
                      "org.kde.plasma.kdeaichat/metadata.json",
                      "org.kde.plasma.kdeaichat/contents/ui/main.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/Security.js",
                      "org.kde.plasma.kdeaichat/contents/ui/VoiceManager.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/kde_ai_helper.py",
                      "org.kde.plasma.kdeaichat/contents/ui/kdeaichat/__init__.py",
                      "org.kde.plasma.kdeaichat/contents/ui/kdeaichat/privacy.py",
                      "org.kde.plasma.kdeaichat/contents/ui/store/Wallet.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/store/ChatStore.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/store/HelperRunner.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/store/Migration.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/store/Storage.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/backends/DirectBackend.js",
                      "org.kde.plasma.kdeaichat/contents/ui/backends/OpenCodeBackend.js",
                      "org.kde.plasma.kdeaichat/contents/ui/backends/PiBackend.js",
                      "org.kde.plasma.kdeaichat/contents/ui/backends/AgentEvents.js",
                      "org.kde.plasma.kdeaichat/contents/ui/config/ProvidersPanel.qml",
                      "org.kde.plasma.kdeaichat/contents/config/config.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/ConfigProviders.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/ConfigHarness.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/ConfigChat.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/ConfigSchedules.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/ConfigVoice.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/ConfigAppearance.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/ScheduleDialog.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/config/ModelCombo.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/config/OpenCodeSettings.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/config/PiSettings.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/config/TemplatesEditor.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/config/SchedulerService.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/config/VoiceEngine.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/config/VoiceStatusGrid.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/NoticeBanner.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/OpenCodeMode.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/PiMode.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/PermissionButtons.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/PiChatSettings.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/MessageModel.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/MessageBlocks.js",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/ChatView.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/MessageDelegate.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/MessageBody.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/MessageText.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/CodeBlock.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/ReasoningBlock.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/AttachmentChips.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/QuestionCard.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/ContextList.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/MessageActions.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/ChatHeader.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/OpenCodeBar.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/RenameRow.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/Composer.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/SessionList.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/ChatBody.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/ChatInfoSummary.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/ChatOverridesForm.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/ChatSettingsDraft.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/ChatStats.js",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/ChatTitle.js",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/ResizeHandle.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/StreamBuffer.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/StreamingText.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/DeferredBuilder.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/ChatShortcuts.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/ComposerStatus.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/EmptyState.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/ErrorActions.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/MonoBlock.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/PermissionDetail.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/TemplateSuggestions.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/PrimaryButton.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/ToolCard.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/UndoNotice.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/ErrorText.js",
                      "org.kde.plasma.kdeaichat/contents/ui/chat/PromptTemplates.js",
                      "org.kde.plasma.kdeaichat/contents/ui/kdeaichat/chats.py",
                      "org.kde.plasma.kdeaichat/contents/ui/kdeaichat/opencode_server.py",
                      "org.kde.plasma.kdeaichat/contents/ui/kdeaichat/pi_bridge.py",
                      "org.kde.plasma.kdeaichat/contents/ui/kdeaichat/pi_bridge_server.py",
                      "org.kde.plasma.kdeaichat/contents/ui/kdeaichat/procs.py",
                      "org.kde.plasma.kdeaichat/contents/ui/voice/voice_helper.py",
                  ]
                  missing = [name for name in required if name not in names]
                  if missing:
                      raise SystemExit("package is missing: " + ", ".join(missing))
          print("fresh package manifest verified")
          PY

  # Ubuntu only has Plasma 5, so QML checks run on the Arch image with Qt 6,
  # Kirigami and Plasma 6 preinstalled.
  qml:
    runs-on: arch-plasma

    steps:
      - uses: actions/checkout@v4

      # Compiles every shipped QML file offscreen and runs component tests;
      # a component that fails to load fails the build.
      - name: QML tests
        env:
          REQUIRE_QML_TESTS: "1"
        run: |
          pytest -q tests/test_qml.py -rs

      - name: Upload QML screenshots
        if: always()
        uses: actions/upload-artifact@v3  # v4 is not supported by Gitea
        with:
          name: qml-screens
          path: build/qml-screens/
          if-no-files-found: ignore

      # Warning counts per file may only go down (scripts/qmllint_baseline.json).
      - name: qmllint ratchet
        run: |
          python scripts/qmllint_ratchet.py --qmllint /usr/lib/qt6/bin/qmllint
