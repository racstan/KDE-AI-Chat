name: CI

# Runs on the local Gitea (act_runner with rootless podman), not GitHub
# Actions. Runner labels map to local images:
#   ubuntu-latest -> localhost/act-ubuntu
#   arch-plasma   -> localhost/act-arch-plasma (ci/arch-plasma/Containerfile)
on:
  push:
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest anyio

      - name: Run tests
        run: |
          pytest -q

      - name: Check file sizes
        run: |
          python scripts/check_file_sizes.py

      - name: Verify a freshly built package contains the source tree
        run: |
          python - <<'PY'
          import pathlib, tempfile, zipfile
          root = pathlib.Path("org.kde.plasma.kdeaichat")
          with tempfile.NamedTemporaryFile(suffix=".plasmoid") as f:
              with zipfile.ZipFile(f.name, "w", zipfile.ZIP_DEFLATED) as archive:
                  for path in root.rglob("*"):
                      if path.is_file() and "__pycache__" not in path.parts and "translate/venv" not in str(path):
                          archive.write(path, path.as_posix())
              with zipfile.ZipFile(f.name) as archive:
                  names = set(archive.namelist())
                  required = [
                      "org.kde.plasma.kdeaichat/metadata.json",
                      "org.kde.plasma.kdeaichat/contents/ui/main.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/Security.js",
                      "org.kde.plasma.kdeaichat/contents/ui/VoiceManager.qml",
                      "org.kde.plasma.kdeaichat/contents/ui/kde_ai_helper.py",
                      "org.kde.plasma.kdeaichat/contents/ui/kdeaichat/__init__.py",
                      "org.kde.plasma.kdeaichat/contents/ui/kdeaichat/privacy.py",
                      "org.kde.plasma.kdeaichat/contents/ui/voice/voice_helper.py",
                  ]
                  missing = [name for name in required if name not in names]
                  if missing:
                      raise SystemExit("package is missing: " + ", ".join(missing))
          print("fresh package manifest verified")
          PY

  # Ubuntu only has Plasma 5, so QML checks run on the Arch image with Qt 6,
  # Kirigami and Plasma 6 preinstalled.
  qml:
    runs-on: arch-plasma

    steps:
      - uses: actions/checkout@v4

      # Compiles every shipped QML file offscreen and runs component tests;
      # a component that fails to load fails the build.
      - name: QML tests
        env:
          REQUIRE_QML_TESTS: "1"
        run: |
          pytest -q tests/test_qml.py -rs

      - name: Upload QML screenshots
        if: always()
        uses: actions/upload-artifact@v3  # v4 is not supported by Gitea
        with:
          name: qml-screens
          path: build/qml-screens/
          if-no-files-found: ignore

      # Warning counts per file may only go down (scripts/qmllint_baseline.json).
      - name: qmllint ratchet
        run: |
          python scripts/qmllint_ratchet.py --qmllint /usr/lib/qt6/bin/qmllint
