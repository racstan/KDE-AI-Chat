  # Ubuntu only has Plasma 5, so QML checks run on the Arch image with Qt 6,
  # Kirigami and Plasma 6 preinstalled.
  qml:
    runs-on: arch-plasma

    steps:
      - uses: actions/checkout@v4

      # Compiles every shipped QML file offscreen and runs component tests;
      # a component that fails to load fails the build.
      - name: QML tests
        env:
          REQUIRE_QML_TESTS: "1"
        run: |
          pytest -q tests/test_qml.py tests/test_stt_qml.py -rs

      - name: Upload QML screenshots
        if: always()
        uses: actions/upload-artifact@v3  # v4 is not supported by Gitea
        with:
          name: qml-screens
          path: build/qml-screens/
          if-no-files-found: ignore

      # Warning counts per file may only go down (scripts/qmllint_baseline.json).
      - name: qmllint ratchet
        run: |
          python scripts/qmllint_ratchet.py --qmllint /usr/lib/qt6/bin/qmllint
